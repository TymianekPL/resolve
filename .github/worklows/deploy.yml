name: Deploy workflow

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy Static Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_SSH_KEY }}
          source: "frontend/dist/*"
          strip_components: 2
          target: "/data/data/com.termux/files/home/dist"
          overwrite: true

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install & Build Backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Copy Backend Code to Termux
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_SSH_KEY }}
          source: "backend/dist,backend/package.json,backend/package-lock.json"
          strip_components: 1
          target: "/data/data/com.termux/files/home/server"
          overwrite: true

      - name: Production Install & PM2 Lifecycle Update
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_SSH_KEY }}
          script: |
            cd /data/data/com.termux/files/home/server
            npm ci --production
            pm2 reload express-api || pm2 start dist/index.js --name "express-api"
            pm2 save
